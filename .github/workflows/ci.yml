name: ParcelPilot CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. TypeScript & Static Analysis
  typecheck-and-lint:
    name: TypeScript Check & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Build Next.js Production App
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'AIzaSyDummyKeyForCIBuild' }}
        run: npm run build

  # 2. Automated Test Suite (16 Modules)
  test-suite:
    name: Run Master 16-Module Test Suite
    runs-on: ubuntu-latest
    needs: typecheck-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Full Test Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
        run: npm run test

  # 3. Docker Image Verification
  docker-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: test-suite

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: calquity-parcelpilot:latest
