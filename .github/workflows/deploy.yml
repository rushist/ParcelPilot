name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: SSH Deploy to EC2
    runs-on: ubuntu-latest
    # Only run deploy if EC2 secrets are configured in the GitHub repository
    if: github.repository == 'rushist/ParcelPilot'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on EC2
        uses: appleboy/ssh-action@v1.0.3
        if: env.EC2_HOST != ''
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          EC2_KEY: ${{ secrets.EC2_SSH_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER || 'ubuntu' }}/CALQUITY || cd /home/ec2-user/CALQUITY
            git pull origin main
            docker-compose up -d --build
            docker-compose exec -u root app npm run db:migrate || true
            docker-compose exec -u root app npm run import:data || true
            docker-compose exec -u root app npm run ingest:docs || true
            echo "🚀 Deployment successfully completed on EC2!"
