version: '3.8'

services:
  # 1. Next.js ParcelPilot Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parcelpilot-app
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@postgres:5432/parcelpilot
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-1.5-flash}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-004}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - parcelpilot-net

  # 2. Qdrant Vector Search Engine
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: parcelpilot-qdrant
    restart: always
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - parcelpilot-net

  # 3. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: parcelpilot-postgres
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: parcelpilot
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d parcelpilot']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - parcelpilot-net

volumes:
  pg_data:
  qdrant_data:

networks:
  parcelpilot-net:
    driver: bridge
